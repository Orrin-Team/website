# orrinengine.com — static site served from /var/www/orrin
#
# TLS is configured by hand here rather than by `certbot --nginx`. Certbot's
# nginx plugin picks a server block to patch, and if this file is not loaded
# when it runs it will patch the DEFAULT block instead — attaching this domain
# and certificate to /var/www/html. Issue the cert with `certonly` and keep the
# config under version control:
#
#   certbot certonly --webroot -w /var/www/orrin \
#       -d orrinengine.com -d www.orrinengine.com
#
# Install:
#   sudo cp deploy/nginx/orrinengine.com.conf /etc/nginx/sites-available/orrinengine.com
#   sudo ln -s /etc/nginx/sites-available/orrinengine.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# None of these blocks is default_server, so they answer only for their own
# server_name and cannot affect the other sites on this box.
#
# Note: `http2` is deliberately absent from the listen directives. Listen
# options are per-socket, not per-vhost — another site on this box already
# sets it for :443, and repeating it risks a duplicate-option error.

# ---------------------------------------------------------------------------
# HTTP → HTTPS. Redirects straight to the apex so http://www never costs two
# hops.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name orrinengine.com www.orrinengine.com;

    # Leave room for webroot ACME challenges at renewal time.
    location /.well-known/acme-challenge/ {
        root /var/www/orrin;
    }

    location / {
        return 301 https://orrinengine.com$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www → apex. SITE_URL is the apex, so this keeps one canonical address and
# stops the two spellings splitting search ranking.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.orrinengine.com;

    ssl_certificate /etc/letsencrypt/live/orrinengine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orrinengine.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://orrinengine.com$request_uri;
}

# ---------------------------------------------------------------------------
# The site.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name orrinengine.com;

    ssl_certificate /etc/letsencrypt/live/orrinengine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orrinengine.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/orrin;
    index index.html;

    # Astro builds directory-style URLs: /roadmap/ is dist/roadmap/index.html.
    # $uri/ makes nginx find the index and 301 /roadmap → /roadmap/ for free.
    location / {
        try_files $uri $uri/ =404;
    }

    # The site's own 404, not nginx's plain-text one.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Astro fingerprints everything under /_astro/ with a content hash, so the
    # filename changes whenever the contents do. That makes it safe to cache
    # forever — a new build produces new URLs rather than stale hits.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Screenshots and brand art keep stable filenames across builds, so they
    # get a shorter TTL and must revalidate rather than being pinned for a year.
    location ~* ^/(shots|brand)/ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate" always;
        access_log off;
    }

    # HTML must never be cached hard, or a deploy won't reach anyone holding a
    # cached copy. The hashed asset URLs inside it are what get cached instead.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = /favicon.png {
        expires 30d;
        access_log off;
    }

    # Don't serve the notes kept alongside the images.
    location = /shots/README.md {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
    # PNG and WebP are already compressed; gzipping them burns CPU for nothing.

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # The site loads fonts and CSS from Google Fonts; everything else is
    # first-party. Tighten this further if the fonts are ever self-hosted.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location ~ /\. {
        deny all;
        access_log off;
    }
}

# Shared response headers — install at /etc/nginx/snippets/orrin-headers.conf
#
# This exists because of an nginx inheritance rule that is easy to get wrong:
# an `add_header` inside a `location` block discards EVERY `add_header`
# inherited from the enclosing `server` block. It is replace, not merge.
#
# So any location that sets its own Cache-Control silently loses the security
# headers. Including this snippet in each such location puts them back.
#
# If you add a location with its own add_header, include this too.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# The site loads fonts and CSS from Google Fonts; everything else is
# first-party. 'unsafe-inline' covers the small amount of inline style Astro
# emits — tighten it if the fonts are ever self-hosted.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
